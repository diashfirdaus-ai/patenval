[project]
name = "techval-backend"
version = "1.0.0"
description = "TechVal AI — Scientific Technology Assessment, Readiness, and Economic Valuation Platform"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18",
    "cryptography>=44.0.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.5",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "httpx>=0.28.0",
    "google-genai>=1.0.0",
    "openai>=1.55.0",
    "sse-starlette>=2.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
